<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctua — Assets</title>
<link rel="icon" type="image/png" href="/marca/logo-laranja-circulo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin-hub.css">
<script src="/inspection-resolver.js"></script>
<script src="/hub-core.js"></script>
<script src="/card.js"></script>
</head>
<body>

<nav>
  <a class="logo" href="/" aria-label="Noctua">
    <img class="logo-img-light" src="/marca/logo-laranja.png" alt="Noctua">
    <img class="logo-img-dark"  src="/marca/logo-branco.png" alt="Noctua">
  </a>
  <div class="sp"></div>
  <button class="nl" id="btnLang" onclick="NoctuaHub.toggleLang()" title="Switch language" style="font-weight:700;font-size:11px;letter-spacing:.5px">EN</button>
  <button class="nl" id="btnTheme" onclick="NoctuaHub.toggleTheme()" title="Toggle theme"></button>
</nav>

<main>
  <div class="sect-tag" data-pt="Asset Hub" data-en="Asset Hub">Asset Hub</div>
  <h1 class="sect-h" data-pt="<em>Assets</em> da Noctua." data-en="Noctua <em>assets</em>.">Noctua <em>assets</em>.</h1>
  <div class="sect-sub" data-pt="Modelos 3D públicos com seu histórico de inspeções ao longo do tempo." data-en="Public 3D models with their inspection history over time.">Public 3D models with their inspection history over time.</div>

  <div class="tools">
    <input id="search" class="search" type="text" data-placeholder-pt="Filtrar por nome…" data-placeholder-en="Filter by name…" placeholder="Filter by name…" oninput="renderGrid()">
    <div class="count" id="count"></div>
  </div>

  <div id="listArea">
    <div class="loading"><span class="spinner"></span><span data-pt="Carregando assets…" data-en="Loading assets…">Loading assets…</span></div>
  </div>
</main>

<div id="notif"></div>

<script>
// Public asset hub: lists every asset with requireLogin === false.
// All lang/theme/listing wiring lives in /hub-core.js — this file just
// orchestrates the filter + grid + empty/error copy.
let assets = [];

NoctuaHub.bootPrefs();
NoctuaHub.onLangChange(renderGrid);

async function refresh() {
  const area = document.getElementById('listArea');
  const lang = NoctuaHub.lang();
  area.innerHTML = `<div class="loading"><span class="spinner"></span><span>${lang === 'pt' ? 'Carregando assets…' : 'Loading assets…'}</span></div>`;
  document.getElementById('count').textContent = '';
  try {
    const slugs = await NoctuaHub.listAssetSlugs();
    const results = await Promise.all(slugs.map(NoctuaHub.fetchAsset));
    assets = NoctuaHub.sortAssetsByLandingThenDate(
      results.filter(a => a && a.isOpen),
      new Set()
    );
    renderGrid();
  } catch (e) {
    area.innerHTML = `<div class="err"><b>${lang === 'pt' ? 'Erro ao carregar' : 'Failed to load'}</b>${NoctuaHub.esc(e.message)}</div>`;
  }
}

function renderGrid() {
  const area = document.getElementById('listArea');
  const lang = NoctuaHub.lang();
  const items = NoctuaHub.filterBySearch(assets, document.getElementById('search').value);
  const lbl = lang === 'pt' ? (items.length === 1 ? 'asset' : 'assets')
                            : (items.length === 1 ? 'asset' : 'assets');
  document.getElementById('count').innerHTML = `<b>${items.length}</b> ${lbl}`;
  if (!items.length) {
    const head = lang === 'pt' ? 'Nada por aqui ainda' : 'Nothing here yet';
    const msg  = lang === 'pt' ? 'Nenhum asset público disponível no momento.'
                                : 'No public asset available right now.';
    area.innerHTML = `<div class="empty"><b>${head}</b>${msg}</div>`;
    return;
  }
  const ctx = { lang };
  const cards = items.map(a => NoctuaCard.render({
    type: 'asset', mode: 'public',
    data: { slug: a.slug, project: a.project, thumbnail: a.thumbnail, date: a.date },
    ctx,
  })).join('');
  area.innerHTML = `<div class="grid">${cards}</div>`;
}

refresh();
</script>
</body>
</html>
