<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#111111;--s1:#111111;--s2:#1a1a1a;--bd:rgba(255,255,255,.14);
  --acc:#ff6600;--acc2:#ffb366;--acc3:#cc5500;
  --green:#10b981;--yellow:#facc15;--orange:#f97316;--red:#ef4444;
  --tx:#f0f0f0;--tx2:#888888;--tx3:#444444
}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
body.light{
  --bg:#ffffff;--s1:#ffffff;--s2:#f5f5f5;--bd:rgba(0,0,0,.14);
  --tx:#141414;--tx2:#6b6b6b;--tx3:#a3a3a3
}
body.light #viewer{background:#cccccc}
body.light #hmLegend{background:rgba(245,245,245,.92)}

/* header/.hbtn rules come from /viewer-header.css. .v-rail / .v-inspector /
   .v-statusbar / .v-pane rules come from /viewer.css (built by /viewer-shell.js).
   Below: inspector-pane content styling only — cards, donut, bars, item list. */

.stitle{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin:14px 0 7px}
.v-pane > .stitle:first-child{margin-top:2px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.scard{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
.scard.s2{grid-column:span 2}
.sval{font-size:22px;font-weight:800;line-height:1}
.slbl{font-size:9px;color:var(--tx2);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.cr{color:var(--red)}.co{color:var(--orange)}.cy{color:var(--yellow)}.cg{color:var(--green)}.cb{color:var(--acc)}
.donut-row{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:11px 12px;margin-bottom:4px}
.dlegend{display:flex;flex-direction:column;gap:5px}
.dleg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)}
.ddot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;flex-direction:column;gap:3px}
.bhead{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2)}
.btrack{height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.bfill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.ilist{display:flex;flex-direction:column;gap:5px}
.ii{background:var(--s2);border:1px solid var(--bd);border-left:3px solid transparent;border-radius:7px;padding:9px 11px;cursor:pointer;transition:all .15s}
.ii:hover,.ii.sel{border-color:var(--acc);border-left-color:var(--acc);background:rgba(255,102,0,.07)}
.ii.sc{border-left-color:var(--red)}.ii.sh{border-left-color:var(--orange)}.ii.sm{border-left-color:var(--yellow)}.ii.sl{border-left-color:var(--green)}
.ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.iid{font-size:11px;font-weight:700}
.ibadge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px}
.ibadge.critical{background:rgba(239,68,68,.15);color:var(--red)}
.ibadge.high{background:rgba(249,115,22,.15);color:var(--orange)}
.ibadge.medium{background:rgba(250,204,21,.15);color:var(--yellow)}
.ibadge.low{background:rgba(16,185,129,.15);color:var(--green)}
.irow{display:flex;align-items:center;gap:5px}
.chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.chip.fissura{background:rgba(99,102,241,.15);color:#a5b4fc}
.chip.furo{background:rgba(250,204,21,.15);color:var(--yellow)}
.chip.corrosao{background:rgba(239,68,68,.15);color:var(--red)}
.iloc{font-size:9px;color:var(--tx3);margin-left:auto}
.fbtns{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{background:var(--s2);border:1px solid var(--bd);color:var(--tx2);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s;font-family:inherit}
.fbtn.on,.fbtn:hover{background:var(--acc);border-color:var(--acc);color:#fff}

#viewer{flex:1;position:relative;overflow:hidden;background:#0a0a0a}
#glCanvas,#pcCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#pcCanvas{display:none}
body.splat-mode #glCanvas{display:none}
body.splat-mode #pcCanvas{display:block}
#heatCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:.5}

/* Loading overlay (#loadOverlay, .spin, .ll, .ls, .prog-*) moved to
   /viewer.css — see <link rel=stylesheet> at the top. Keep this file
   focused on inspection-specific UI. */
/* Card look comes from /auth-card.css. Below: viewer-only overlay + theme map. */
#authGate{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;
  --ag-card-bg:var(--s2);--ag-border:var(--bd);--ag-text:var(--tx);--ag-text2:var(--tx2);--ag-text3:var(--tx3);--ag-acc:var(--acc);--ag-shadow:0 20px 50px rgba(0,0,0,.4)}
#authGate.hidden{display:none}
#authGateBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(7px) brightness(.8) saturate(1.05);transform:scale(1.06);opacity:0;transition:opacity .5s ease}
body.light #authGateBg{filter:blur(7px) brightness(1.02) saturate(1.05)}
#authGateBg.has-img{opacity:1}
.ag-scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
body.light .ag-scrim{background:rgba(245,245,245,.4)}
.ag-card{position:relative;z-index:2}   /* sit above the blurred preview */
#pickBtn{display:none;align-items:center;gap:8px;background:var(--acc);border:none;color:#fff;font-size:12px;font-weight:700;padding:10px 22px;border-radius:7px;cursor:pointer;font-family:inherit;margin-top:8px}
#pickBtn:hover{background:var(--acc3)}
#pickBtn svg{flex-shrink:0}

#hmLegend{position:absolute;bottom:18px;right:18px;z-index:10;background:rgba(17,17,17,.9);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font-size:11px}
.hlt{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx2);margin-bottom:7px}
.grad{width:140px;height:8px;border-radius:4px;background:linear-gradient(to right,#10b981,#facc15,#f97316,#ef4444);margin-bottom:4px}
.gradl{display:flex;justify-content:space-between;font-size:9px;color:var(--tx3)}

/* Tooltip + slide-in detail panel + .dcard styles live in /viewer.css
   (mounted by /viewer-ui.js). The old #tip / .rpanel / .dcard rules are gone —
   the shared module owns all of them now. */

/* Timeline pane (inside the Inspector). Each .ts-item is a card per
   inspection of the asset — clicking re-loads markers without leaving the
   page (same asset, different epoch). */
.ts-list{display:flex;flex-direction:column;gap:6px}
.ts-item{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;color:var(--tx2);text-decoration:none;transition:all .12s;background:var(--s2)}
.ts-item:hover{border-color:var(--acc);color:var(--acc)}
.ts-item.current{background:var(--acc);border-color:var(--acc);color:#fff}
.ts-date{font-size:12px;font-weight:700;letter-spacing:.3px}
.ts-pts{font-size:10px;opacity:.75;letter-spacing:.4px;text-transform:uppercase}
.ts-empty{padding:24px 8px;text-align:center;color:var(--tx3);font-size:11px}

#notif{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:9px 18px;font-size:12px;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
#notif.show{opacity:1}

/* On mobile the status bar floats above the bottom rail; keep #notif above
   both so success messages stay readable. */
@media (max-width: 768px){
  #notif{bottom:88px}
}
</style>
<script src="/i18n.js"></script>
<script src="/inspection-resolver.js"></script>
<script src="/hub-core.js"></script>

</head>
<body>
<script>(function(){try{if(localStorage.getItem('noctua_theme')==='light')document.body.classList.add('light');}catch(e){}})();</script>

<header>
  <noctua-logo></noctua-logo>
  <a class="hbtn" id="backToAsset" href="/assets/" style="display:none" data-i18n="viewer.back_to_asset">← Inspeções</a>
  <div class="hdiv"></div>
  <div class="proj"><b id="projName">—</b></div>
  <div class="sp"></div>
  <button class="hbtn" id="btnLang" onclick="toggleLang()">EN</button>
  <button class="hbtn" id="btnTheme" onclick="toggleTheme()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</header>

<!-- Inspector pane content. Lives in <template> so the HTML stays readable;
     /viewer-shell.js moves these into the right rail at mount time. -->
<template id="pane-overview">
  <div class="stitle" data-i18n="common.summary.title">Resumo</div>
  <div class="sgrid">
    <div class="scard"><div class="sval cb" id="cTotal">—</div><div class="slbl" data-i18n="common.summary.total">Total</div></div>
    <div class="scard"><div class="sval cr" id="cCrit">—</div><div class="slbl" data-i18n="common.summary.critical">Críticas</div></div>
    <div class="scard"><div class="sval co" id="cHigh">—</div><div class="slbl" data-i18n="common.summary.high">Altas</div></div>
    <div class="scard"><div class="sval cy" id="cMed">—</div><div class="slbl" data-i18n="common.summary.medium">Médias</div></div>
    <div class="scard s2"><div class="sval cg" id="cLow">—</div><div class="slbl" data-i18n="common.summary.low">Baixas</div></div>
  </div>
  <div class="stitle" data-i18n="common.by_type">Por Tipo</div>
  <div class="donut-row">
    <canvas id="donut" width="80" height="80" style="flex-shrink:0"></canvas>
    <div class="dlegend">
      <div class="dleg"><div class="ddot" style="background:#a5b4fc"></div><span><span data-i18n="type.fissura">Fissura</span>: <span id="legF">0</span></span></div>
      <div class="dleg"><div class="ddot" style="background:#facc15"></div><span><span data-i18n="type.furo">Furo</span>: <span id="legU">0</span></span></div>
      <div class="dleg"><div class="ddot" style="background:#ef4444"></div><span><span data-i18n="type.corrosao">Corrosão</span>: <span id="legC">0</span></span></div>
    </div>
  </div>
  <div class="stitle" data-i18n="common.risk_score">Score de Risco</div>
  <div class="bars">
    <div class="bitem"><div class="bhead"><span data-i18n="common.risk.structural">Estrutural</span><span id="bSv">—</span></div><div class="btrack"><div class="bfill" id="bS" style="width:0%;background:var(--red)"></div></div></div>
    <div class="bitem"><div class="bhead"><span data-i18n="common.risk.surface">Superficial</span><span id="bFv">—</span></div><div class="btrack"><div class="bfill" id="bF" style="width:0%;background:var(--orange)"></div></div></div>
    <div class="bitem"><div class="bhead"><span data-i18n="common.risk.corrosion">Corrosão</span><span id="bCv">—</span></div><div class="btrack"><div class="bfill" id="bC" style="width:0%;background:var(--yellow)"></div></div></div>
  </div>
</template>

<template id="pane-list">
  <div class="fbtns">
    <button class="fbtn on" onclick="setFilter(this,'all')" data-i18n="common.filters.all">Todos</button>
    <button class="fbtn" onclick="setFilter(this,'fissura')" data-i18n="common.filters.fissura">Fissura</button>
    <button class="fbtn" onclick="setFilter(this,'furo')" data-i18n="common.filters.furo">Furo</button>
    <button class="fbtn" onclick="setFilter(this,'corrosao')" data-i18n="common.filters.corrosao">Corrosão</button>
  </div>
  <div class="ilist" id="ilist"></div>
</template>

<template id="pane-timeline">
  <div class="ts-empty" data-i18n="viewer.timeline.empty">Esta inspeção não está atrelada a um ativo, ou é a única.</div>
  <div class="ts-list" id="tsList" style="display:none"></div>
</template>

<div id="viewer">
    <!-- Paywall gate: covers only the 3D viewport — the rest of the inspection UI stays visible.
         Starts hidden; only protected views (and only until sign-in) reveal it after the JSON loads,
         so open views never flash a login wall. -->
    <div id="authGate" class="hidden">
      <div id="authGateBg"></div>
      <div class="ag-scrim"></div>
      <div class="ag-card">
        <noctua-logo no-link img-class="ag-logo"></noctua-logo>
        <svg class="ag-lock" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff6600" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/>
          <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
          <circle cx="12" cy="15.5" r="1.3"/>
        </svg>
        <div class="ag-title" data-i18n="gate.title">Modelo 3D bloqueado</div>
        <div class="ag-sub"   data-i18n="gate.sub">Entre com sua conta Google para liberar o modelo 3D.</div>
        <button class="ag-gbtn" id="agBtn" onclick="window.agSignIn && window.agSignIn()">
          <svg width="16" height="16" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          <span data-i18n="gate.button">Continuar com Google</span>
        </button>
        <button id="agContinue" class="ag-continue" style="display:none"></button>
        <button id="agSwitch"   class="ag-switch"   style="display:none" data-i18n="gate.switch">Entrar com outra conta</button>
        <div class="ag-note"  data-i18n="gate.note">Seu login é usado apenas para registrar quem acessou a inspeção.</div>
      </div>
    </div>
    <canvas id="glCanvas" tabindex="0"></canvas>
    <canvas id="pcCanvas" tabindex="0"></canvas>
    <canvas id="heatCanvas"></canvas>
    <div id="markerOverlay" style="position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden"></div>

    <div id="loadOverlay">
      <div class="spin" id="loadSpin"></div>
      <div class="ll" id="loadLbl" data-i18n="viewer.loading.label">Carregando modelo…</div>
      <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
      <div class="ls" id="loadSub" data-i18n="viewer.loading.sub">Aguarde</div>
      <button id="pickBtn" onclick="document.getElementById('glbInput').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Selecionar modelo .glb
      </button>
      <input type="file" id="glbInput" accept=".glb" style="display:none" onchange="loadGLBFromFile(event)">
    </div>

    <div id="hmLegend">
      <div class="hlt" data-i18n="common.heatmap.title">Intensidade de Risco</div>
      <div class="grad"></div>
      <div class="gradl"><span data-i18n="common.heatmap.low">Baixa</span><span data-i18n="common.heatmap.medium">Média</span><span data-i18n="common.heatmap.high">Alta</span><span data-i18n="common.heatmap.critical">Crítica</span></div>
    </div>

  <!-- #noctua-tip + #noctua-detail mounted by /viewer-ui.js inside #viewer -->
</div>
<!-- Shell (rail + inspector + status bar) is built by /viewer-shell.js at boot. -->

<div id="notif"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SceneCore    from '/scene-core.js';
import { createMarkerOverlay } from '/marker-overlay.js';
import { mountViewerUI }       from '/viewer-ui.js';
import { mountViewerShell }    from '/viewer-shell.js';
import { loadSplatPC, destroyPcApp, setPcTheme, setSplatTopView, setSplatFreeView, getSplatMarkerScreens } from '/splat-pc.js';
// Shared inspection helpers — pointTags/tagChips/etc. used to be duplicated
// here and in admin/edit; they live in /inspection-detail.js now.
import {
  esc, tagKey, tagLabel, tagColor, tagChip, tagChips, pointTags,
  tagGroupsFor, generateMockPhoto, buildDetailArgs, paintScoreRing,
  formatInspectionDateTime,
  TAG_CURATED, TAG_FIXED, TAG_CURATED_ORDER, SEV_HEX,
} from '/inspection-detail.js';

// Shell first — it relocates #viewer into its <main> slot, so we must build
// the rail/inspector/statusbar BEFORE viewer-ui.js mounts its tooltip/detail
// (those anchor on #viewer's positioning).
const _shell = mountViewerShell({
  canvasContainer: document.getElementById('viewer'),
  insertAfter: document.querySelector('header'),
  panels: [
    { id: 'overview', title: { i18n: 'shell.btn.overview', fallback: 'Visão geral' },
      iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="13" width="4" height="8"/><rect x="10" y="9" width="4" height="12"/><rect x="17" y="5" width="4" height="16"/></svg>' },
    { id: 'list', title: { i18n: 'shell.btn.list', fallback: 'Lista' },
      iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>' },
    { id: 'timeline', title: { i18n: 'shell.btn.timeline', fallback: 'Timeline' },
      iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
  ],
  panelsLabel: { i18n: 'shell.section.reports', fallback: 'Relatórios' },
  toggles: [
    { id: 'heatmap', title: { i18n: 'shell.btn.heatmap', fallback: 'Mapa de calor' }, initial: true,
      iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
      onChange: (on) => applyHeatmapVisible(on) },
    { id: 'markers', title: { i18n: 'shell.btn.markers', fallback: 'Marcadores' }, initial: true,
      iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',

let modelTransformScale  = 1;
const modelTransformCenter = new THREE.Vector3();
let frameCount   = 0;
const raycaster  = new THREE.Raycaster();

const SEV_COLOR  = { critical:0xef4444, high:0xf97316, medium:0xfacc15, low:0x10b981 };
// SEV_HEX imported from /inspection-detail.js. SEV_RGB stays local — heatmap
// needs the array form to feed canvas gradient stops.
const SEV_RGB    = { critical:[239,68,68], high:[249,115,22], medium:[250,204,21], low:[16,185,129] };

// ── INIT THREE.JS ─────────────────────────────────────────────────────────────
function initThree() {
  const canvas = document.getElementById('glCanvas');
  const viewer = document.getElementById('viewer');
  const w = viewer.clientWidth, h = viewer.clientHeight;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  const _initLight = currentTheme === 'light';
  scene.background = new THREE.Color(_initLight ? 0xcccccc : 0x0a0a0a);
  scene.fog = new THREE.FogExp2(_initLight ? 0xcccccc : 0x0a0a0a, 0.016);

  perspCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 500);
  perspCamera.position.set(8, 6, 12);

  const aspect = w / h, frustum = 20;
  orthoCamera = new THREE.OrthographicCamera(
    -frustum * aspect / 2,  frustum * aspect / 2,
     frustum / 2,          -frustum / 2,
     0.1, 1000
  );
  orthoCamera.position.set(0, 100, 0);
  orthoCamera.up.set(0, 0, -1);
  orthoCamera.lookAt(0, 0, 0);
  camera = perspCamera;

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(10, 20, 10); sun.castShadow = true;
  sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 200;
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top  = 30;  sun.shadow.camera.bottom = -30;
  sun.shadow.mapSize.set(2048, 2048);
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0xffd0a0, 0.3).position.set(-10, 5, -10) && sun);
  scene.add(new THREE.HemisphereLight(0x222222, 0x111111, 0.4));

  grid = new THREE.GridHelper(60, 60, _initLight ? 0xb0b0b0 : 0x2a2a2a, _initLight ? 0xa0a0a0 : 0x1a1a1a);
  scene.add(grid);
  scene.add(markerGroup);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1;
  controls.maxDistance = 120;
  controls.target.set(0, 2, 0);
  controls.update();

  new ResizeObserver(() => {
    const vw = viewer.clientWidth, vh = viewer.clientHeight;
    renderer.setSize(vw, vh);
    perspCamera.aspect = vw / vh;
    perspCamera.updateProjectionMatrix();
    if (viewMode === 'top') {
      const a = vw / vh;
      const half = (orthoCamera.top - orthoCamera.bottom) / 2;
      orthoCamera.left = -half * a; orthoCamera.right = half * a;
      orthoCamera.updateProjectionMatrix();
    }
  }).observe(viewer);

  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousemove', onCanvasMove);
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  frameCount++;
  controls.update();
  renderer.render(scene, camera);
  if (showHeatmap && frameCount % 2 === 0) drawHeatmap();
  if (POINTS.length) updateMarkerOverlay();
}

// ── CAMERA MODES ──────────────────────────────────────────────────────────────
function _ctx() {
  return { canvas: document.getElementById('glCanvas'), scene, perspCamera, orthoCamera, camera, controls, modelRoot, grid, viewMode, currentTheme };
}

// applyFreeView / applyTopView are the actual scene mutators; the rail
// invokes them via onSelect. Public window.setFreeView/setTopView aliases
// keep any external callers working (e.g. tests).

  _statusCache.view = 'Free'; refreshStatus();
}
function applyTopView() {
  if (currentModelKind === 'splat') {
    if (!setSplatTopView()) { _shell.mode().activate('free'); return; }
  } else {
    const ctx = _ctx();
    if (!SceneCore.setTopView(ctx)) { _shell.mode().activate('free'); return; }

window.setFreeView = () => _shell.mode().activate('free');
window.setTopView  = () => _shell.mode().activate('top');

// ── LOAD MODEL ───────────────────────────────────────────────────────────────
// Dispatches by extension: .glb → three.js (SceneCore.loadGLBProgress);
// .splat/.ply/.ksplat/.sog → PlayCanvas (loadSplatPC). Both engines feed
// the same HTML marker overlay so the inspection visual stays identical.
let currentModelKind = 'glb';   // 'glb' | 'splat'
function loadGLBFromURL(url, name) {
  const lang = (window.NoctuaI18n && window.NoctuaI18n.lang)
    ? (window.NoctuaI18n.lang.startsWith('pt') ? 'pt' : 'en')
    : ((document.documentElement.lang || 'en').startsWith('pt') ? 'pt' : 'en');
  const els = {
    overlay: document.getElementById('loadOverlay'),
    sub:     document.getElementById('loadSub'),
    fill:    document.getElementById('progFill'),
  };
  const isSplat = SceneCore.isSplatUrl(url);
  if (isSplat) {
    currentModelKind = 'splat';
    document.body.classList.add('splat-mode');
    const theme = document.body.classList.contains('light') ? 'light' : 'dark';
    loadSplatPC({
      canvas: document.getElementById('pcCanvas'),
      url, name,
      modelRotation: pendingRotation,
      modelOffset:   pendingOffset,
      modelScale:    pendingScale,
      theme,
      lang,
      els,
    }).then(() => {
      // Hash filename is noise; just label the kind in the status strip.
      _statusCache.model = 'splat';
      _statusCache.verts = '—';
      refreshStatus();
      // Markers are in entity-local space — no scaleMarkerPositions needed,
      // the splat entity owns the world transform.
      rebuildMarkers();
    }).catch(() => {
      showInspectionError('viewer.error.model_unavailable.title', 'viewer.error.model_unavailable.sub');
    });
    return;
  }
  // GLB path (default)
  currentModelKind = 'glb';
  document.body.classList.remove('splat-mode');
  destroyPcApp();
  const ctx = _ctx();
  SceneCore.loadGLBProgress(ctx, {
    url, name,
    modelRotation: pendingRotation,
    modelOffset:   pendingOffset,
    modelScale:    pendingScale,
    lang,
    els,
  }).then(({ modelRoot: root, verts, scaledCenter, scale }) => {
    modelRoot = root;
    // GLB filename from GCS is a content hash — surface the project's verts
    // count instead, which is what the user actually wants to know.
    _statusCache.model = '';
    _statusCache.verts = `${(verts/1000).toFixed(0)}k`;
    refreshStatus();
    scaleMarkerPositions(scale, scaledCenter);
    rebuildMarkers();
  }).catch(() => {
    showInspectionError('viewer.error.model_unavailable.title', 'viewer.error.model_unavailable.sub');
  });
}

window.loadGLBFromFile = e => {
  const file = e.target.files[0]; if (!file) return;
  document.getElementById('loadSpin').style.display = 'block';
  document.getElementById('progTrack').style.display = 'block';
  document.getElementById('pickBtn').style.display = 'none';
  document.getElementById('loadLbl').textContent = `Carregando ${file.name}…`;
  document.getElementById('loadSub').textContent = 'Aguarde';
  document.getElementById('progFill').style.width = '0%';
  loadGLBFromURL(URL.createObjectURL(file), file.name);
};

function scaleMarkerPositions(scale, centerOffset) {
  modelTransformScale = scale;
  modelTransformCenter.copy(centerOffset);
  if (modelRoot) {
    SceneCore.recomputeMarkerWorlds(_ctx(), POINTS);
  } else {
    POINTS.forEach(pt => {
      pt._worldX = (pt.position.x - centerOffset.x) * scale;
      pt._worldY = (pt.position.y - centerOffset.y) * scale;
      pt._worldZ = (pt.position.z - centerOffset.z) * scale;
    });
  }
}

// ── MARKERS ───────────────────────────────────────────────────────────────────
// HTML-overlay markers — see /marker-overlay.js. Old sprite + ring code
// removed; the overlay handles color/score/glow/selection via CSS and a
// projection callback we supply from three.js's camera each frame.
const _markerOvl = createMarkerOverlay({
  container: document.getElementById('markerOverlay'),
  onSelect:  id => selectPt(id),
  onHover:   (id, e) => { hoveredId = id; const pt = POINTS.find(p => p.id === id); if (pt) showTip(e, pt); },
  onLeave:   () => { hoveredId = null; hideTip(); },
});
const _ovlVec3 = new THREE.Vector3();
function rebuildMarkers() {
  while (markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
  updateMarkerOverlay();
}
function updateMarkerOverlay() {
  if (!showMarkers) { _markerOvl.clear(); return; }
  if (currentModelKind === 'splat') {
    const arr = getSplatMarkerScreens(POINTS);
    const byId = new Map(arr.map(s => [s.id, s]));
    _markerOvl.update(POINTS, selectedId, pt => {
      const s = byId.get(pt.id);
      return s ? { x: s.x, y: s.y, visible: s.visible, depth: s.depth } : { visible: false };
    });
    return;
  }
  if (!camera || !renderer) return;
  const vw = renderer.domElement.clientWidth;
  const vh = renderer.domElement.clientHeight;
  _markerOvl.update(POINTS, selectedId, pt => {
    _ovlVec3.set(
      pt._worldX ?? pt.position.x,
      pt._worldY ?? pt.position.y,
      pt._worldZ ?? pt.position.z,
    );
    _ovlVec3.project(camera);
    return {
      x: (_ovlVec3.x + 1) / 2 * vw,
      y: (1 - (_ovlVec3.y + 1) / 2) * vh,
      visible: _ovlVec3.z >= -1 && _ovlVec3.z <= 1,
      depth: _ovlVec3.z,
    };
  });
}

// ── HEATMAP ───────────────────────────────────────────────────────────────────
// Picks the projector based on kind: three.js vec3.project for GLB, and the
// PC helper getSplatMarkerScreens for splat (which uses PC's worldToScreen
// against the entity's world transform). Same radial-gradient rendering on
// #heatCanvas otherwise.
function drawHeatmap() {
  const cv = document.getElementById('heatCanvas');
  const refCanvas = currentModelKind === 'splat'
    ? document.getElementById('pcCanvas')
    : (renderer && renderer.domElement);
  if (!refCanvas) return;
  const vw = refCanvas.clientWidth, vh = refCanvas.clientHeight;
  if (cv.width !== vw) cv.width = vw;
  if (cv.height !== vh) cv.height = vh;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, vw, vh);
  if (!showHeatmap || !POINTS.length) return;

  // Resolve each point to screen pixels via the active engine.
  let screens;
  if (currentModelKind === 'splat') {
    screens = new Map();
    for (const s of getSplatMarkerScreens(POINTS)) screens.set(s.id, s);
  }
  POINTS.forEach(pt => {
    let sx, sy, visible;
    if (currentModelKind === 'splat') {
      const s = screens.get(pt.id);
      if (!s) return;
      sx = s.x; sy = s.y; visible = s.visible;
    } else {
      vec3.set(pt._worldX ?? pt.position.x, pt._worldY ?? pt.position.y, pt._worldZ ?? pt.position.z);
      vec3.project(camera);
      visible = vec3.z <= 1;
      sx = (vec3.x + 1) / 2 * vw;
      sy = -(vec3.y - 1) / 2 * vh;
    }
    if (!visible) return;
    if (sx < -100 || sx > vw + 100 || sy < -100 || sy > vh + 100) return;
    const [r,g,b] = SEV_RGB[pt.severity];
    const radius = (pt.score / 100) * 70 + 20;
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
    grad.addColorStop(0,   `rgba(${r},${g},${b},.55)`);
    grad.addColorStop(.45, `rgba(${r},${g},${b},.2)`);
    grad.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    ctx.beginPath(); ctx.arc(sx, sy, radius, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
  });
}

// ── INTERACTION ───────────────────────────────────────────────────────────────
function getMouseNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return { x: ((e.clientX - rect.left) / rect.width) * 2 - 1, y: -((e.clientY - rect.top) / rect.height) * 2 + 1 };
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const c = { critical:0, high:0, medium:0, low:0 };
  POINTS.forEach(p => c[p.severity]++);
  document.getElementById('cTotal').textContent = POINTS.length;
  document.getElementById('cCrit').textContent  = c.critical;
  document.getElementById('cHigh').textContent  = c.high;
  document.getElementById('cMed').textContent   = c.medium;
  document.getElementById('cLow').textContent   = c.low;

  const groups = tagGroupsFor(POINTS);
  renderTypeLegend(groups);
  renderTypeBars(groups);
  renderFilters(groups);

  const gs = POINTS.length ? Math.round(POINTS.reduce((s,p)=>s+p.score,0)/POINTS.length) : 0;
  _statusCache.score = `${gs}/100`;
  _statusCache.pts   = String(POINTS.length);
  refreshStatus();

  drawDonut(groups);
  renderList();
}

function renderTypeLegend(groups) {
  const el = document.querySelector('.dlegend'); if (!el) return;
  el.innerHTML = groups.length
    ? groups.map(g => `<div class="dleg"><div class="ddot" style="background:${tagColor(g.raw).fg}"></div><span>${esc(tagLabel(g.raw))}: <span>${g.count}</span></span></div>`).join('')
    : `<div class="dleg" style="opacity:.5"><span>—</span></div>`;
}

function renderTypeBars(groups) {
  const el = document.querySelector('.bars'); if (!el) return;
  const totalScore = groups.reduce((s,g) => s + g.score, 0) || 1;
  el.innerHTML = groups.length
    ? groups.map(g => {
        const pct = Math.round(g.score / totalScore * 100);
        return `<div class="bitem"><div class="bhead"><span>${esc(tagLabel(g.raw))}</span><span>${pct}%</span></div><div class="btrack"><div class="bfill" style="width:${pct}%;background:${tagColor(g.raw).fg}"></div></div></div>`;
      }).join('')
    : `<div style="font-size:10px;color:var(--tx3)">—</div>`;
}

function renderFilters(groups) {
  groups = groups || tagGroupsFor(POINTS);
  const box = document.querySelector('.fbtns'); if (!box) return;
  if (filterType !== 'all' && !groups.some(g => g.key === filterType)) filterType = 'all';
  const allLbl = window.NoctuaI18n ? window.NoctuaI18n.t('common.filters.all') : 'Todos';
  box.innerHTML =
    `<button class="fbtn ${filterType==='all'?'on':''}" onclick="setFilter(this,'all')">${esc(allLbl)}</button>` +
    groups.map(g => `<button class="fbtn ${filterType===g.key?'on':''}" onclick="setFilter(this,'${g.key}')">${esc(tagLabel(g.raw))}</button>`).join('');
}

function drawDonut(groups) {
  const cv = document.getElementById('donut');
  const ctx = cv.getContext('2d');
  const total = groups.reduce((s,g) => s + g.count, 0) || 1;
  ctx.clearRect(0,0,80,80);
  let a = -Math.PI/2;
  groups.forEach(g => {
    const ang = (g.count/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(40,40); ctx.arc(40,40,30,a,a+ang); ctx.closePath();
    ctx.fillStyle = tagColor(g.raw).fg; ctx.fill(); a += ang;
  });
  ctx.beginPath(); ctx.arc(40,40,18,0,Math.PI*2);
  ctx.fillStyle = currentTheme === 'light' ? '#ebebeb' : '#222222'; ctx.fill();
  ctx.fillStyle = currentTheme === 'light' ? '#141414' : '#f0f0f0';
  ctx.font = 'bold 13px Inter,Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(groups.reduce((s,g) => s + g.count, 0), 40, 40);
}

// ── LIST ──────────────────────────────────────────────────────────────────────
function renderList() {
  const items = filterType==='all' ? POINTS : POINTS.filter(p=>pointTags(p).some(t=>tagKey(t)===filterType));
  const sorted = [...items].sort((a,b)=>b.score-a.score);
  document.getElementById('ilist').innerHTML = sorted.map(pt=>`
    <div class="ii s${pt.severity[0]} ${selectedId===pt.id?'sel':''}" onclick="selectPt('${pt.id}')">
      <div class="ih"><span class="iid">${pt.id}</span><span class="ibadge ${pt.severity}">${pt.score}</span></div>
      <div class="irow"><span style="display:flex;flex-wrap:wrap;gap:3px">${tagChips(pt)}</span><span class="iloc">${pt.location}</span></div>
    </div>
  `).join('');
}
window.renderList = renderList;

// ── DETAIL PANEL ──────────────────────────────────────────────────────────────
// Body HTML + mock photo + score ring all live in /inspection-detail.js so the
// asset viewer and admin editor render the same thing. The local wrapper just
// hands the args to viewer-ui and paints the ring after mount.
function renderDetail(pt) {
  const _t = (k, f) => window.NoctuaI18n ? window.NoctuaI18n.t(k) : f;
  const args = buildDetailArgs(pt, { t: _t, embeddedDefaultPhoto: EMBEDDED_DEFAULT_PHOTO });
  _viewerUI.openDetail(pt, args);
  requestAnimationFrame(() => paintScoreRing(pt, { theme: currentTheme }));
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
// Heatmap + Markers visibility are owned by the rail toggles; these helpers
// are the actual scene mutators. window.* aliases stay so legacy callers
// can flip the state without knowing about the rail.
function applyHeatmapVisible(on) {
  showHeatmap = on;
  const legend = document.getElementById('hmLegend');
  if (legend) legend.style.display = on ? 'block' : 'none';
  if (!on) { const cv = document.getElementById('heatCanvas'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); }
}
function applyMarkersVisible(on) {
  showMarkers = on;
  markerGroup.visible = on;
}
window.toggleHeatmap = () => _shell.toggle('heatmap').set(!_shell.toggle('heatmap').get());
window.toggleMarkers = () => _shell.toggle('markers').set(!_shell.toggle('markers').get());

window.setFilter = (btn, type) => {
  filterType = type;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderList();
};

// Legacy tab API — the rail panels are the new tabs. Map index → panel id.
window.openTab = n => {
  const id = n === 0 ? 'overview' : n === 1 ? 'list' : 'timeline';
  _shell.panel(id)?.activate();
};

window.toggleTheme = () => {
  window.NoctuaHub.toggleViewerTheme();
  // onThemeChange listener (set above) repaints scene + donut.
  if (selectedId) { const pt = POINTS.find(p=>p.id===selectedId); if (pt) renderDetail(pt); }
};

function notify(msg) {
  const n = document.getElementById('notif');
  n.textContent = msg; n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'), 3000);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
initThree();

function showInspectionError(titleKey, subKey) {
  const t = (k, f) => window.NoctuaI18n ? window.NoctuaI18n.t(k) : f;
  const titleText = t(titleKey, titleKey);
  _statusCache.model = titleText; refreshStatus();
  const logoSrc = document.body.classList.contains('light')
    ? '/marca/logo-laranja-circulo.png'
    : '/marca/logo-branco.png';
  document.getElementById('loadOverlay').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:380px;padding:24px">
      <img src="${logoSrc}" alt="Noctua" style="height:42px">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#ff6600" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div data-i18n="${titleKey}" style="font-size:18px;font-weight:700;color:var(--tx)">${titleText}</div>
      <div data-i18n="${subKey}" style="font-size:13px;color:var(--tx2);line-height:1.5">${t(subKey, subKey)}</div>
      <a href="/" data-i18n="common.back_to_landing" style="margin-top:4px;background:#ff6600;color:#fff;text-decoration:none;padding:10px 22px;border-radius:7px;font-size:12px;font-weight:700;font-family:inherit">
        ${t('common.back_to_landing', 'Voltar para noctuavisio.com')}
      </a>
    </div>
  `;
}

// Slug comes from /inspection/<slug>. The root 404.html may have captured the
// route into sessionStorage and redirected here — restore the URL if so.
let slug = null;
const captured = sessionStorage.getItem('noctua_route');
if (captured) {
  try {
    const r = JSON.parse(captured);
    if (r && r.page === 'inspection' && r.slug) {
      slug = r.slug;
      sessionStorage.removeItem('noctua_route');
    }
  } catch (_) {}
}
if (!slug) {
  const parts = location.pathname.split('/').filter(Boolean);
  if (parts[0] === 'inspection' && parts[1]) slug = parts[1];
}
if (!slug) slug = new URLSearchParams(location.search).get('slug');
// Always normalize to /inspection/<slug> so a URL copied from the address bar
// points at the OG-enabled route (WhatsApp/social previews need a real HTML
// file at that path, not the ?slug= query form). Preserve `?asset=…` and any
// other query params so the time-slider context survives the rewrite.
if (slug && /^[a-z0-9-]+$/i.test(slug)) {
  try {
    const qs = new URLSearchParams(location.search);
    qs.delete('slug');
    const tail = qs.toString();
    const pretty = `/inspection/${slug}${tail ? '?' + tail : ''}`;
    if (location.pathname + location.search !== pretty) {
      history.replaceState({}, '', pretty);
    }
  } catch (_) {}
}

let inspectionData = null;   // cached inspection JSON (fetched before login for the preview)
let revealed = false;        // guards against double model-load on the login/fetch race

// Keep visitors signed in for a long time (sliding window) — minimal friction.
const REMEMBER_MS = 90 * 24 * 60 * 60 * 1000;   // ~90 days
let rememberedUser = null;
try { const _r = JSON.parse(localStorage.getItem('noctua_remember') || 'null'); if (_r && _r.email) rememberedUser = _r; } catch (_) {}
const rememberValid = () => !!(rememberedUser && rememberedUser.ts && (Date.now() - rememberedUser.ts < REMEMBER_MS));

// Auto sign-in when the remembered session is still valid → the gate never shows.
let noctuaUser = rememberValid() ? rememberedUser : null;

let openMsgPromise = null;   // resolves to the Discord message id created by 'open'

const beaconUrl = (params) => {
  const u = new URL('https://noctua-log.autumn-lab-5eb3.workers.dev/');
  u.searchParams.set('slug', slug);
  for (const [k, v] of Object.entries(params)) if (v) u.searchParams.set(k, v);
  if (noctuaUser?.email) u.searchParams.set('email', noctuaUser.email);
  if (noctuaUser?.name)  u.searchParams.set('name',  noctuaUser.name);
  return u.toString();
};

// Two events per visit, ONE Discord message: 'open' creates it (and we keep the
// message id), 'auth' edits that same message in place (👀 Abriu → ✅ Autorizou).
// Local dev (localhost/127.0.0.1) is suppressed so admin testing doesn't spam
// the Discord channel — the bot is for real-visitor signal only.
const fireBeacon = (event, project, thumbnail) => {
  if (!slug) return;
  if (window.NoctuaHub && window.NoctuaHub.isLocalhost && window.NoctuaHub.isLocalhost()) return;
  if (event === 'open') {
    openMsgPromise = fetch(beaconUrl({ event, project, thumbnail, wait: '1' }), { mode: 'cors' })
      .then(r => r.json()).then(j => (j && j.id) || null).catch(() => null);
    return;
  }
  Promise.resolve(openMsgPromise).then(id => {   // wait for the 'open' id, then edit
    try { fetch(beaconUrl({ event, project, thumbnail, msg: id }), { mode: 'cors', keepalive: true }); } catch (_) {}
  });
};

// Per-view paywall. Default protected (login required) so legacy inspections
// (no field) keep requiring login; only requireLogin:false opens it to everyone.
//   protected (default) → gate blocks the model until Google sign-in; pings
//                         "abriu" + "autorizou" (com e-mail) no Discord.
//   open (requireLogin:false) → opens directly, totalmente silencioso (sem registro).
// Admin (unlocked via /admin/) bypasses the gate so navigating from the asset
// hub or /asset/<slug>'s timeline lands on a usable viewer — without this,
// the gate sat on top of the loading spinner and looked like an indefinite
// hang.
function needsLogin(data) {
  if (window.NoctuaHub && window.NoctuaHub.isAdminUnlocked && window.NoctuaHub.isAdminUnlocked()) return false;
  return !data || data.requireLogin !== false;
}

// Drops the gate and loads the 3D model. Needs the inspection JSON in hand; only
// protected views also wait for sign-in before revealing.
function revealInspection() {
  if (revealed || !inspectionData) return;
  if (needsLogin(inspectionData) && !noctuaUser?.email) return;
  revealed = true;
  hideGate();
  const data = inspectionData;
  if (needsLogin(data)) fireBeacon('auth', data.project, data.thumbnail);   // autorizou (com e-mail)
  if (!data.model) {
    showInspectionError('viewer.error.incomplete.title', 'viewer.error.incomplete.sub');
    return;
  }
  loadGLBFromURL(data.model, data.modelName || 'inspection.glb');
}

// Fetches the inspection up front. Open views (and already-signed-in protected
// views) reveal immediately; a protected view with no session shows the gate
// (blurred preview + login) and waits.
function bootInspection() {
  if (!slug) {
    hideGate();
    showInspectionError('viewer.error.invalid_link.title', 'viewer.error.invalid_link.sub');
    return;
  }
  NoctuaInspections.fetchInspectionResolved(slug)
    .then(r => r.composed)
    .then(data => {
      inspectionData = data;
      POINTS = data.points || [];
      pendingRotation = data.modelRotation || null;
      pendingOffset   = data.modelOffset   || null;
      pendingScale    = data.modelScale    || null;
      if (data.project) {
        document.getElementById('projName').textContent = data.project;
        document.title = `Noctua Inspect — ${data.project}`;
      }
      updateStats(); renderList();

      // Open views são silenciosas; protegidas pingam "abriu" (e depois "autorizou").
      if (needsLogin(data)) fireBeacon('open', data.project, data.thumbnail);

      if (needsLogin(data) && !noctuaUser?.email) {
        if (data.thumbnail) {                     // blurred locked preview behind the gate
          const bg = document.getElementById('authGateBg');
          bg.style.backgroundImage = `url("${data.thumbnail}")`;
          bg.classList.add('has-img');
        }
        showGate();
        if (rememberedUser?.email) showRemembered();   // one-click "Continuar como"
      } else {
        revealInspection();                       // open, ou protegida já logada
      }
    })
    .catch(() => { hideGate(); showInspectionError('viewer.error.not_found.title', 'viewer.error.not_found.sub'); });
}

// ── AUTH GATE (Google Sign-In) ──────────────────────────────────────────────
// Dedicated External (public) OAuth client — separate Google Cloud project from
// the admin's Internal client, so anyone can sign in here while admin stays org-only.
// Same custom button + OAuth token flow as the admin (we only need the e-mail for
// attribution), so every login screen looks and behaves identically.
const GATE_CLIENT_ID = '1028880541767-1abg4egot0pv7h1e0dbd3ec81gkplimh.apps.googleusercontent.com';

function hideGate() { document.getElementById('authGate').classList.add('hidden'); }
function showGate() { document.getElementById('authGate').classList.remove('hidden'); }

function signInAs(user) {
  noctuaUser = { email: user.email, name: user.name || '', sub: user.sub, ts: Date.now() };
  rememberedUser = noctuaUser;
  try { localStorage.setItem('noctua_remember', JSON.stringify(noctuaUser)); } catch (_) {}
  revealInspection();   // reveals now if JSON is ready; else bootInspection's .then will
}

let tokenClient = null;
function ensureTokenClient() {
  if (tokenClient || !window.google?.accounts?.oauth2) return tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GATE_CLIENT_ID,
    scope: 'openid email profile',
    callback: async (resp) => {
      const btn = document.getElementById('agBtn'); if (btn) btn.disabled = false;
      if (!resp || resp.error || !resp.access_token) return;
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${resp.access_token}` } });
        const info = await r.json();
        if (info && info.email) signInAs({ email: info.email, name: info.name || '', sub: info.sub });
      } catch (_) {}
    },
  });
  return tokenClient;
}
window.agInitAuth = ensureTokenClient;   // GSI script onload pre-inits the client

window.agSignIn = () => {
  const tc = ensureTokenClient();
  if (!tc) return;
  const btn = document.getElementById('agBtn'); if (btn) btn.disabled = true;
  tc.requestAccessToken();
};

// Returning visitor: one-click "Continuar como <nome>". "Outra conta" → full sign-in.
function refreshRememberedLabel() {
  const cont = document.getElementById('agContinue');
  if (!cont || cont.style.display === 'none' || !rememberedUser?.email) return;
  const lang = window.NoctuaI18n ? window.NoctuaI18n.lang : 'pt';
  cont.textContent = (lang === 'pt' ? 'Continuar como ' : 'Continue as ') + (rememberedUser.name || rememberedUser.email);
}

function showRemembered() {
  const cont = document.getElementById('agContinue');
  cont.style.display = '';
  cont.onclick = () => signInAs(rememberedUser);
  refreshRememberedLabel();
  document.getElementById('agBtn').style.display = 'none';
  const sw = document.getElementById('agSwitch');
  sw.style.display = '';
  sw.onclick = () => {
    cont.style.display = 'none';
    sw.style.display = 'none';
    document.getElementById('agBtn').style.display = '';
    window.agSignIn();
  };
}

// Keep the "Continuar como" label in sync with the language toggle.
if (window.NoctuaI18n?.onChange) {
  window.NoctuaI18n.onChange(refreshRememberedLabel);
}

// ── Timeline pane (other inspections of the same asset when ?asset=<slug>) ─
// Lists the asset's inspections chronologically inside the right rail's
// Timeline tab. Click → /inspection/?slug=<other>&asset=<assetSlug> (full
// reload for now; in-place overlay swap is a future iteration). The Timeline
// rail button is dimmed if there's nothing to show.
(async function bootTimelinePane() {
  const assetSlug = new URLSearchParams(location.search).get('asset');
  const tlList  = document.getElementById('tsList');
  const tlEmpty = _shell.panel('timeline')?.el?.querySelector('.ts-empty');
  if (!assetSlug || !/^[a-z0-9-]+$/i.test(assetSlug) || !slug) return;
  // Back button → admin hub if the user is admin-unlocked, public hub otherwise.
  const back = document.getElementById('backToAsset');
  if (back) {
    const adminUnlocked = window.NoctuaHub && window.NoctuaHub.isAdminUnlocked();
    back.href = adminUnlocked
      ? `/admin/?asset=${encodeURIComponent(assetSlug)}`
      : `/inspections/?asset=${encodeURIComponent(assetSlug)}`;
    back.style.display = '';
  }
  let allSlugs = [];
  try {
    const r = await fetch('/inspections/index.json', { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (Array.isArray(j)) allSlugs = j; }
  } catch {}
  if (!allSlugs.length) return;
  const items = (await Promise.all(allSlugs.map(async s => {
    try {
      const { inspection, composed } = await NoctuaInspections.fetchInspectionResolved(s);
      if (inspection.asset !== assetSlug) return null;
      return { slug: s, date: composed.date || null, points: Array.isArray(composed.points) ? composed.points.length : 0 };
    } catch { return null; }
  }))).filter(Boolean);
  if (items.length < 2) return;   // single inspection → nothing to navigate to
  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));   // newest first
  const lang = (window.NoctuaI18n && typeof window.NoctuaI18n.lang === 'string') ? window.NoctuaI18n.lang : 'en';
  const ptsW = 'pts';
  if (!tlList) return;
  tlList.innerHTML = items.map(i => {
    const cur = i.slug === slug ? ' current' : '';
    const href = `/inspection/?slug=${encodeURIComponent(i.slug)}&asset=${encodeURIComponent(assetSlug)}`;
    const date = formatInspectionDateTime(i.date);
    return `<a class="ts-item${cur}" href="${href}"><span class="ts-date">${date}</span><span class="ts-pts">${i.points} ${ptsW}</span></a>`;
  }).join('');
  tlList.style.display = '';
  if (tlEmpty) tlEmpty.style.display = 'none';
})();

// Boot: fetch the inspection, then bootInspection decides per access mode whether
// to reveal or show the gate. Here we only refresh the signed-in session's expiry
// (sliding window) so returning visitors stay logged in.
bootInspection();
if (slug && noctuaUser?.email) {
  noctuaUser.ts = Date.now();
  try { localStorage.setItem('noctua_remember', JSON.stringify(noctuaUser)); } catch (_) {}
}
</script>
