<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctua — Inspeções</title>
<link rel="icon" type="image/png" href="/marca/logo-laranja-circulo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin-hub.css">
<script src="/inspection-resolver.js"></script>
</head>
<body>

<nav>
  <a class="logo" href="/" aria-label="Noctua">
    <img class="ld" src="/marca/logo-laranja-circulo.png" alt="Noctua">
    <img class="ll" src="/marca/logo-branco.png" alt="Noctua">
  </a>
  <a class="nl vis" id="backNav" href="/assets/">← Asset Hub</a>
  <div class="sp"></div>
  <button class="nl" id="btnLang" onclick="toggleLang()" title="Switch language" style="font-weight:700;font-size:11px;letter-spacing:.5px">EN</button>
  <button class="nl" id="btnTheme" onclick="toggleTheme()" title="Toggle theme"></button>
</nav>

<main>
  <div class="sect-tag" id="sectTag" data-pt="Inspection Hub" data-en="Inspection Hub">Inspection Hub</div>
  <h1 class="sect-h" id="sectH" data-pt="Inspeções." data-en="Inspections.">Inspections.</h1>
  <div class="sect-sub" id="sectSub" data-pt="Histórico de inspeções deste asset, do mais recente ao mais antigo." data-en="Inspection history of this asset, most recent first.">Inspection history of this asset, most recent first.</div>

  <div class="tools">
    <input id="search" class="search" type="text" data-placeholder-pt="Filtrar por data ou slug…" data-placeholder-en="Filter by date or slug…" placeholder="Filter by date or slug…" oninput="renderGrid()">
    <div class="count" id="count"></div>
  </div>

  <div id="listArea">
    <div class="loading"><span class="spinner"></span><span data-pt="Carregando inspeções…" data-en="Loading inspections…">Loading inspections…</span></div>
  </div>
</main>

<div id="notif"></div>

<script>
// ════════════════════════════════════════════
// HUB PÚBLICO DE INSPEÇÕES — filtra por ?asset=<slug>.
// Só mostra se o asset for público (requireLogin === false).
// ════════════════════════════════════════════
let inspections = [];
let currentAsset = null;          // {slug, name, thumbnail, isOpen}
const currentAssetSlug = new URLSearchParams(location.search).get('asset') || '';
let _lang = 'en';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ── Lang + theme ──────────────────────────────────────────────────────────
function applyLang(lang) {
  _lang = lang;
  document.getElementById('btnLang').textContent = lang === 'en' ? 'PT' : 'EN';
  document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
  document.querySelectorAll('[data-pt]').forEach(el => { el.innerHTML = el.dataset[lang] || el.dataset.pt; });
  document.querySelectorAll('[data-placeholder-pt]').forEach(el => { el.placeholder = el.dataset[lang === 'en' ? 'placeholderEn' : 'placeholderPt'] || el.dataset.placeholderPt; });
  try { localStorage.setItem('noctua_lang', lang); } catch {}
  updateHeader();
  renderGrid();
}
function toggleLang() { applyLang(_lang === 'pt' ? 'en' : 'pt'); }
function applyTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark');
  document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀' : '☾';
  try { localStorage.setItem('noctua_theme', theme); } catch {}
}
function toggleTheme() { applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'); }

(function bootPrefs(){
  let lang = 'en';
  try { lang = localStorage.getItem('noctua_lang') || (navigator.language || 'en').startsWith('pt') ? 'pt' : 'en'; } catch {}
  if (lang !== 'pt' && lang !== 'en') lang = 'en';
  applyLang(lang);
  let theme = 'dark';
  try { theme = localStorage.getItem('noctua_theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch {}
  applyTheme(theme === 'light' ? 'light' : 'dark');
})();

// Header dinâmico com o nome do asset focado.
function updateHeader() {
  const h = document.getElementById('sectH');
  if (!h || !currentAsset) return;
  h.innerHTML = _lang === 'pt'
    ? `Inspeções de <em>${esc(currentAsset.name || currentAssetSlug)}</em>.`
    : `Inspections of <em>${esc(currentAsset.name || currentAssetSlug)}</em>.`;
}

// ── Listing ───────────────────────────────────────────────────────────────
async function fetchAsset(slug) {
  try {
    const r = await fetch(`/assets/${slug}.json`, { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return { slug, name: j.name || slug, thumbnail: j.thumbnail || null, isOpen: j.requireLogin === false };
  } catch { return null; }
}
async function listInspectionSlugs() {
  const r = await fetch('/inspections/index.json', { cache: 'no-store' });
  if (!r.ok) throw new Error(`Manifest /inspections/index.json indisponível (HTTP ${r.status}).`);
  const j = await r.json();
  if (!Array.isArray(j)) throw new Error('Manifest inválido.');
  return j.slice();
}
async function fetchInspectionCard(slug) {
  try {
    const { inspection, composed } = await NoctuaInspections.fetchInspectionResolved(slug);
    return {
      slug,
      asset:  inspection.asset || null,
      points: Array.isArray(composed.points) ? composed.points.length : 0,
      date:   composed.date || null,
    };
  } catch { return null; }
}

async function refresh() {
  const area = document.getElementById('listArea');
  if (!currentAssetSlug) {
    area.innerHTML = `<div class="err"><b>${_lang === 'pt' ? 'Asset não especificado' : 'No asset specified'}</b>${_lang === 'pt' ? 'Use ?asset=&lt;slug&gt; ou volte pra <a href="/assets/">/assets/</a>.' : 'Use ?asset=&lt;slug&gt; or go back to <a href="/assets/">/assets/</a>.'}</div>`;
    return;
  }
  area.innerHTML = `<div class="loading"><span class="spinner"></span><span>${_lang === 'pt' ? 'Carregando inspeções…' : 'Loading inspections…'}</span></div>`;
  document.getElementById('count').textContent = '';
  try {
    currentAsset = await fetchAsset(currentAssetSlug);
    if (!currentAsset || !currentAsset.isOpen) {
      area.innerHTML = `<div class="err"><b>${_lang === 'pt' ? 'Asset privado ou inexistente' : 'Private or unknown asset'}</b>${_lang === 'pt' ? 'Este asset não está público.' : 'This asset is not public.'}</div>`;
      return;
    }
    updateHeader();
    const allSlugs = await listInspectionSlugs();
    const all = await Promise.all(allSlugs.map(fetchInspectionCard));
    inspections = all.filter(i => i && i.asset === currentAssetSlug).sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date);
      if (a.date) return -1; if (b.date) return 1;
      return a.slug.localeCompare(b.slug);
    });
    renderGrid();
  } catch (e) {
    area.innerHTML = `<div class="err"><b>${_lang === 'pt' ? 'Erro ao carregar' : 'Failed to load'}</b>${esc(e.message)}</div>`;
  }
}

function filtered() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  if (!q) return inspections;
  return inspections.filter(i => i.slug.toLowerCase().includes(q) || (i.date || '').toLowerCase().includes(q));
}

function renderGrid() {
  const area = document.getElementById('listArea');
  if (!inspections.length && !currentAsset) return;     // ainda carregando ou erro
  const items = filtered();
  const lbl = _lang === 'pt' ? (items.length === 1 ? 'inspeção' : 'inspeções') : (items.length === 1 ? 'inspection' : 'inspections');
  document.getElementById('count').innerHTML = `<b>${items.length}</b> ${lbl}`;
  if (!items.length) {
    const head = _lang === 'pt' ? 'Sem inspeções' : 'No inspections';
    const msg  = inspections.length
      ? (_lang === 'pt' ? 'Nenhuma inspeção bate com o filtro.' : 'No inspection matches the filter.')
      : (_lang === 'pt' ? 'Este asset ainda não tem inspeções públicas.' : 'No public inspections for this asset yet.');
    area.innerHTML = `<div class="empty"><b>${head}</b>${msg}</div>`;
    return;
  }
  const T = {
    open:   _lang === 'pt' ? 'Abrir'  : 'Open',
    pts:    _lang === 'pt' ? 'pontos' : 'points',
    pt1:    _lang === 'pt' ? 'ponto'  : 'point',
    nothumb:_lang === 'pt' ? 'sem thumb' : 'no thumb',
  };
  const thumbUrl = currentAsset && currentAsset.thumbnail;
  const thumb = thumbUrl
    ? `<img src="${esc(thumbUrl)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${T.nothumb}'}))">`
    : `<div class="ph">${T.nothumb}</div>`;
  area.innerHTML = `<div class="grid">${items.map(i => {
    const cname = i.date
      ? (_lang === 'pt' ? `Inspeção ${esc(i.date)}` : `Inspection ${esc(i.date)}`)
      : (_lang === 'pt' ? 'Inspeção' : 'Inspection');
    const pts = `<span><b>${i.points}</b> ${i.points === 1 ? T.pt1 : T.pts}</span>`;
    const viewHref = `/inspection/?slug=${encodeURIComponent(i.slug)}&asset=${encodeURIComponent(currentAssetSlug)}`;
    return `
      <div class="card">
        <a class="thumb" href="${viewHref}">${thumb}</a>
        <div class="cbody">
          <div class="cname">${cname}</div>
          <div class="cslug">${esc(i.slug)}</div>
          <div class="cmeta">${pts}</div>
        </div>
        <div class="cactions" style="grid-template-columns:1fr">
          <a class="cbtn" href="${viewHref}" style="background:var(--acc);border-color:var(--acc);color:#fff">${T.open}</a>
        </div>
      </div>`;
  }).join('')}</div>`;
}

refresh();
</script>
</body>
</html>
