<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctua — Inspeções</title>
<link rel="icon" type="image/png" href="/marca/logo-laranja-circulo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin-hub.css">
<script src="/inspection-resolver.js"></script>
<script src="/hub-core.js"></script>
<script src="/card.js"></script>
</head>
<body>

<nav>
  <a class="logo" href="/" aria-label="Noctua">
    <img class="ld" src="/marca/logo-laranja-circulo.png" alt="Noctua">
    <img class="ll" src="/marca/logo-branco.png" alt="Noctua">
  </a>
  <a class="nl vis" id="backNav" href="/assets/">← Asset Hub</a>
  <div class="sp"></div>
  <button class="nl" id="btnLang" onclick="NoctuaHub.toggleLang()" title="Switch language" style="font-weight:700;font-size:11px;letter-spacing:.5px">EN</button>
  <button class="nl" id="btnTheme" onclick="NoctuaHub.toggleTheme()" title="Toggle theme"></button>
</nav>

<main>
  <div class="sect-tag" id="sectTag" data-pt="Inspection Hub" data-en="Inspection Hub">Inspection Hub</div>
  <h1 class="sect-h" id="sectH" data-pt="Inspeções." data-en="Inspections.">Inspections.</h1>
  <div class="sect-sub" id="sectSub" data-pt="Histórico de inspeções deste asset, do mais recente ao mais antigo." data-en="Inspection history of this asset, most recent first.">Inspection history of this asset, most recent first.</div>

  <div class="tools">
    <input id="search" class="search" type="text" data-placeholder-pt="Filtrar por data ou slug…" data-placeholder-en="Filter by date or slug…" placeholder="Filter by date or slug…" oninput="renderGrid()">
    <div class="count" id="count"></div>
  </div>

  <div id="listArea">
    <div class="loading"><span class="spinner"></span><span data-pt="Carregando inspeções…" data-en="Loading inspections…">Loading inspections…</span></div>
  </div>
</main>

<div id="notif"></div>

<script>
// Public inspection hub for a single asset (?asset=<slug>). Filters out any
// inspection that doesn't belong to the asset, and refuses to render if the
// asset itself is protected. Shared lang/theme/listing live in /hub-core.js.
let inspections = [];
let currentAsset = null;
const currentAssetSlug = new URLSearchParams(location.search).get('asset') || '';

NoctuaHub.bootPrefs();
NoctuaHub.onLangChange(() => { updateHeader(); renderGrid(); });

function updateHeader() {
  if (!currentAsset) return;
  const lang = NoctuaHub.lang();
  const h = document.getElementById('sectH');
  if (!h) return;
  h.innerHTML = lang === 'pt'
    ? `Inspeções de <em>${NoctuaHub.esc(currentAsset.project || currentAssetSlug)}</em>.`
    : `Inspections of <em>${NoctuaHub.esc(currentAsset.project || currentAssetSlug)}</em>.`;
}

async function refresh() {
  const area = document.getElementById('listArea');
  const lang = NoctuaHub.lang();
  if (!currentAssetSlug) {
    area.innerHTML = `<div class="err"><b>${lang === 'pt' ? 'Asset não especificado' : 'No asset specified'}</b>${lang === 'pt' ? 'Use ?asset=&lt;slug&gt; ou volte pra <a href="/assets/">/assets/</a>.' : 'Use ?asset=&lt;slug&gt; or go back to <a href="/assets/">/assets/</a>.'}</div>`;
    return;
  }
  area.innerHTML = `<div class="loading"><span class="spinner"></span><span>${lang === 'pt' ? 'Carregando inspeções…' : 'Loading inspections…'}</span></div>`;
  document.getElementById('count').textContent = '';
  try {
    currentAsset = await NoctuaHub.fetchAsset(currentAssetSlug);
    if (!currentAsset || !currentAsset.isOpen) {
      area.innerHTML = `<div class="err"><b>${lang === 'pt' ? 'Asset privado ou inexistente' : 'Private or unknown asset'}</b>${lang === 'pt' ? 'Este asset não está público.' : 'This asset is not public.'}</div>`;
      return;
    }
    updateHeader();
    const allSlugs = await NoctuaHub.listInspectionSlugs();
    const all = await Promise.all(allSlugs.map(NoctuaHub.fetchInspectionForCard));
    inspections = NoctuaHub.sortInspectionsByDate(all.filter(i => i && i.asset === currentAssetSlug));
    renderGrid();
  } catch (e) {
    area.innerHTML = `<div class="err"><b>${lang === 'pt' ? 'Erro ao carregar' : 'Failed to load'}</b>${NoctuaHub.esc(e.message)}</div>`;
  }
}

function renderGrid() {
  const area = document.getElementById('listArea');
  if (!inspections.length && !currentAsset) return;
  const lang = NoctuaHub.lang();
  const items = NoctuaHub.filterBySearch(inspections, document.getElementById('search').value);
  const lbl = lang === 'pt'
    ? (items.length === 1 ? 'inspeção' : 'inspeções')
    : (items.length === 1 ? 'inspection' : 'inspections');
  document.getElementById('count').innerHTML = `<b>${items.length}</b> ${lbl}`;
  if (!items.length) {
    const head = lang === 'pt' ? 'Sem inspeções' : 'No inspections';
    const msg  = inspections.length
      ? (lang === 'pt' ? 'Nenhuma inspeção bate com o filtro.' : 'No inspection matches the filter.')
      : (lang === 'pt' ? 'Este asset ainda não tem inspeções públicas.' : 'No public inspections for this asset yet.');
    area.innerHTML = `<div class="empty"><b>${head}</b>${msg}</div>`;
    return;
  }
  const ctx = {
    lang,
    asset: currentAsset ? { slug: currentAsset.slug, project: currentAsset.project, thumbnail: currentAsset.thumbnail } : null,
  };
  const cards = items.map(i => NoctuaCard.render({
    type: 'inspection', mode: 'public', data: i, ctx,
  })).join('');
  area.innerHTML = `<div class="grid">${cards}</div>`;
}

refresh();
</script>
</body>
</html>
