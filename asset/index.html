<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctua — Asset</title>
<link rel="icon" type="image/png" href="/marca/logo-laranja-circulo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/viewer.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#111111;--s1:#111111;--s2:#1a1a1a;--bd:rgba(255,255,255,.14);
  --acc:#ff6600;--acc3:#cc5500;
  --tx:#f0f0f0;--tx2:#888888;--tx3:#444444
}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
body.light{
  --bg:#ffffff;--s1:#ffffff;--s2:#f5f5f5;--bd:rgba(0,0,0,.14);
  --tx:#141414;--tx2:#6b6b6b;--tx3:#a3a3a3
}
body.light #viewer{background:#cccccc}
body.light .ld{display:none}
body.light .ll-logo{display:inline}
.ll-logo{display:none}

header{height:52px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:26px}
.hdiv{width:1px;height:24px;background:var(--bd)}
.proj{font-size:12px;color:var(--tx2)}
.proj b{color:var(--tx);font-weight:700}
.sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd);color:var(--tx2);font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;text-decoration:none}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}

/* Toolbar — same shape and tokens as /inspection/'s .vtbar/.tgrp/.tbtn so
   both viewers feel like the same thing. */
.vtbar{background:var(--s1);border-bottom:1px solid var(--bd);padding:7px 14px;display:flex;align-items:center;gap:7px;flex-shrink:0;z-index:10}
.tgrp{display:flex;gap:3px}
.tbtn{background:var(--s2);border:1px solid var(--bd);color:var(--tx2);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;font-family:inherit}
.tbtn:hover,.tbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.vinfo{font-size:10px;color:var(--tx3)}

#viewer{flex:1;position:relative;overflow:hidden;background:#0a0a0a}
#glCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}

#err{position:absolute;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#err.vis{display:flex}
#err .ebox{max-width:420px}
#err b{display:block;font-size:18px;font-weight:800;margin-bottom:8px}
#err p{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:14px}
#err a{color:var(--acc);text-decoration:none;font-weight:600}
#err a:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <a class="logo" href="/" aria-label="Noctua">
    <img class="ld" src="/marca/logo-laranja-circulo.png" alt="Noctua">
    <img class="ll-logo" src="/marca/logo-branco.png" alt="Noctua">
  </a>
  <div class="hdiv"></div>
  <div class="proj" id="proj"></div>
  <div class="sp"></div>
  <a class="hbtn" id="inspsBtn" href="#" style="display:none">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="13" y2="17"/></svg>
    <span data-pt="Inspeções" data-en="Inspections">Inspections</span>
  </a>
  <a class="hbtn" id="backBtn" href="/assets/" data-pt="← Assets" data-en="← Assets">← Assets</a>
  <button class="hbtn" id="btnLang" title="Switch language" style="font-weight:700">EN</button>
  <button class="hbtn" id="btnTheme" title="Toggle theme"></button>
</header>

<div class="vtbar">
  <div class="tgrp">
    <button class="tbtn on" id="btnLivre" title="Free orbit">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l4-4 4 4"/><path d="M9 5v14"/><path d="M19 15l-4 4-4-4"/><path d="M15 19V5"/></svg>
      <span data-pt="Livre" data-en="Free">Free</span>
    </button>
    <button class="tbtn" id="btnTopo" title="Top view">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><polyline points="12 12 15 10"/></svg>
      <span data-pt="Topo" data-en="Top">Top</span>
    </button>
  </div>
  <div class="sp"></div>
  <div class="vinfo" id="vinfo" data-pt="Carregando modelo…" data-en="Loading model…">Loading model…</div>
</div>

<div id="viewer">
  <canvas id="glCanvas" tabindex="0"></canvas>
  <div id="loadOverlay">
    <div class="spin"></div>
    <div class="ll" id="loadLbl" data-pt="Carregando modelo…" data-en="Loading model…">Loading model…</div>
    <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
    <div class="ls" id="loadSub"></div>
  </div>
  <div id="err">
    <div class="ebox">
      <b id="errHead"></b>
      <p id="errBody"></p>
      <a href="/assets/" data-pt="Voltar pra Assets" data-en="Back to Assets">Back to Assets</a>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SceneCore    from '/scene-core.js';

// ctx mirrors scene-core's shape so theme/view-toggle/load helpers all read
// from the same object. Declared up here so applyTheme can poke it during
// bootPrefs without hitting a TDZ on `scene`.
const ctx = {
  canvas: null, scene: null, renderer: null,
  perspCamera: null, orthoCamera: null, camera: null,
  controls: null, modelRoot: null, grid: null,
  viewMode: 'free', currentTheme: 'dark',
};

// Admin-unlock check: mirrors /admin/'s localStorage cache so a logged-in
// admin can view protected assets without a separate gate here.
const ASSET_ADMIN_EMAILS = ['contact@noctuavisio.com'];
function isAdminUnlocked() {
  try {
    const c = JSON.parse(localStorage.getItem('noctua_admin_unlock') || 'null');
    if (!c || !c.email || !c.until) return false;
    if (Date.now() > c.until) return false;
    return ASSET_ADMIN_EMAILS.includes(c.email);
  } catch { return false; }
}

// ── Lang + theme ──────────────────────────────────────────────────────────
let _lang = 'en';
function applyLang(lang) {
  _lang = lang;
  document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
  document.getElementById('btnLang').textContent = lang === 'en' ? 'PT' : 'EN';
  document.querySelectorAll('[data-pt]').forEach(el => {
    const v = el.dataset[lang] || el.dataset.pt;
    if (v) el.textContent = v;
  });
  try { localStorage.setItem('noctua_lang', lang); } catch {}
}
function toggleLang() { applyLang(_lang === 'pt' ? 'en' : 'pt'); }
function applyTheme(t) {
  document.body.classList.toggle('light', t === 'light');
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀' : '☾';
  if (ctx.scene) SceneCore.applySceneTheme(ctx, t);
  try { localStorage.setItem('noctua_theme', t); } catch {}
}
function toggleTheme() { applyTheme(document.body.classList.contains('light') ? 'dark' : 'light'); }

(function bootPrefs(){
  let lang = 'en';
  try {
    const stored = localStorage.getItem('noctua_lang');
    lang = stored || ((navigator.language || 'en').startsWith('pt') ? 'pt' : 'en');
  } catch {}
  applyLang(lang === 'pt' ? 'pt' : 'en');
  let theme = 'dark';
  try {
    theme = localStorage.getItem('noctua_theme')
      || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch {}
  applyTheme(theme === 'light' ? 'light' : 'dark');
})();
document.getElementById('btnLang').onclick  = toggleLang;
document.getElementById('btnTheme').onclick = toggleTheme;

// ── View toggle (Free/Top) ───────────────────────────────────────────────
function setFreeView() {
  SceneCore.setFreeView(ctx);
  document.getElementById('btnLivre').classList.add('on');
  document.getElementById('btnTopo').classList.remove('on');
}
function setTopView() {
  if (!SceneCore.setTopView(ctx)) return;
  document.getElementById('btnTopo').classList.add('on');
  document.getElementById('btnLivre').classList.remove('on');
}
document.getElementById('btnLivre').onclick = setFreeView;
document.getElementById('btnTopo').onclick  = setTopView;

// ── Scene ─────────────────────────────────────────────────────────────────
function initThree() {
  const canvas = document.getElementById('glCanvas');
  const viewer = document.getElementById('viewer');
  const w = viewer.clientWidth, h = viewer.clientHeight;

  ctx.canvas = canvas;
  ctx.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  ctx.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  ctx.renderer.setSize(w, h);
  ctx.renderer.shadowMap.enabled = true;
  ctx.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  ctx.renderer.toneMapping = THREE.ACESFilmicToneMapping;
  ctx.renderer.toneMappingExposure = 1.2;
  ctx.renderer.outputColorSpace = THREE.SRGBColorSpace;

  ctx.scene = new THREE.Scene();

  ctx.perspCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 500);
  ctx.perspCamera.position.set(8, 6, 12);

  const aspect = w / h, frustum = 20;
  ctx.orthoCamera = new THREE.OrthographicCamera(
    -frustum * aspect / 2,  frustum * aspect / 2,
     frustum / 2,          -frustum / 2,
     0.1, 1000
  );
  ctx.orthoCamera.position.set(0, 100, 0);
  ctx.orthoCamera.up.set(0, 0, -1);
  ctx.orthoCamera.lookAt(0, 0, 0);
  ctx.camera = ctx.perspCamera;

  ctx.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(10, 20, 10); sun.castShadow = true;
  sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 200;
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
  sun.shadow.mapSize.set(2048, 2048);
  ctx.scene.add(sun);
  ctx.scene.add(new THREE.HemisphereLight(0x222222, 0x111111, 0.4));

  // Theme paints bg/fog/grid via SceneCore so /asset/ and /inspection/ stay
  // visually identical when switching themes.
  SceneCore.applySceneTheme(ctx, document.body.classList.contains('light') ? 'light' : 'dark');

  ctx.controls = new OrbitControls(ctx.camera, canvas);
  ctx.controls.enableDamping = true;
  ctx.controls.dampingFactor = 0.08;
  ctx.controls.minDistance = 1;
  ctx.controls.maxDistance = 120;
  ctx.controls.target.set(0, 2, 0);
  ctx.controls.update();

  new ResizeObserver(() => {
    const vw = viewer.clientWidth, vh = viewer.clientHeight;
    ctx.renderer.setSize(vw, vh);
    ctx.perspCamera.aspect = vw / vh;
    ctx.perspCamera.updateProjectionMatrix();
    if (ctx.viewMode === 'top') {
      const a = vw / vh;
      const half = (ctx.orthoCamera.top - ctx.orthoCamera.bottom) / 2;
      ctx.orthoCamera.left = -half * a; ctx.orthoCamera.right = half * a;
      ctx.orthoCamera.updateProjectionMatrix();
    }
  }).observe(viewer);

  (function loop() {
    requestAnimationFrame(loop);
    ctx.controls.update();
    ctx.renderer.render(ctx.scene, ctx.camera);
  })();
}

function showError(head, body) {
  document.getElementById('errHead').textContent = head;
  document.getElementById('errBody').textContent = body || '';
  document.getElementById('loadOverlay').classList.add('hidden');
  document.getElementById('err').classList.add('vis');
}

// ── Boot ──────────────────────────────────────────────────────────────────
async function boot() {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug || !/^[a-z0-9-]+$/i.test(slug)) {
    showError(_lang === 'pt' ? 'Asset não especificado' : 'No asset specified',
              _lang === 'pt' ? 'Use ?slug=<slug>.' : 'Use ?slug=<slug>.');
    return;
  }
  // Admin gets the "← Admin" back link instead of "← Assets" so the nav
  // stays inside the admin workflow.
  const admin = isAdminUnlocked();
  const backBtn = document.getElementById('backBtn');
  if (admin) {
    backBtn.href = '/admin/';
    backBtn.dataset.pt = '← Admin';
    backBtn.dataset.en = '← Admin';
    backBtn.textContent = '← Admin';
  }

  let asset;
  try {
    const r = await fetch(`/assets/${slug}.json`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    asset = await r.json();
  } catch (e) {
    showError(_lang === 'pt' ? 'Asset não encontrado' : 'Asset not found', e.message);
    return;
  }
  if (asset.requireLogin !== false && !admin) {
    showError(_lang === 'pt' ? 'Asset privado' : 'Private asset',
              _lang === 'pt' ? 'Este asset não está disponível publicamente.' : 'This asset is not public.');
    return;
  }
  document.getElementById('proj').innerHTML = `<b>${asset.name || slug}</b>`;
  document.title = `Noctua — ${asset.name || slug}`;
  // Inspections button (admin → /admin/?asset=, public → /inspections/?asset=).
  try {
    const r = await fetch('/inspections/index.json', { cache: 'no-store' });
    if (r.ok) {
      const slugs = await r.json();
      if (Array.isArray(slugs) && slugs.length) {
        const link = document.getElementById('inspsBtn');
        link.href = admin
          ? `/admin/?asset=${encodeURIComponent(slug)}`
          : `/inspections/?asset=${encodeURIComponent(slug)}`;
        link.style.display = '';
      }
    }
  } catch {}
  initThree();
  if (!asset.model) {
    showError(_lang === 'pt' ? 'Asset incompleto' : 'Incomplete asset',
              _lang === 'pt' ? 'O asset não tem modelo configurado.' : 'No model configured for this asset.');
    return;
  }
  try {
    await SceneCore.loadGLBProgress(ctx, {
      url: asset.model,
      name: asset.modelName || 'asset.glb',
      modelRotation: asset.modelRotation,
      modelOffset: asset.modelOffset,
      lang: _lang,
      els: {
        overlay: document.getElementById('loadOverlay'),
        sub:     document.getElementById('loadSub'),
        fill:    document.getElementById('progFill'),
        vinfo:   document.getElementById('vinfo'),
      },
    });
  } catch (err) {
    showError(_lang === 'pt' ? 'Erro ao carregar modelo' : 'Failed to load model', err.message || 'unknown');
  }
}
boot();
</script>
</body>
</html>
