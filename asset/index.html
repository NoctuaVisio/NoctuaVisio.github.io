<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctua — Asset</title>
<link rel="icon" type="image/png" href="/marca/logo-laranja-circulo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/viewer.css">
<link rel="stylesheet" href="/viewer-header.css">
<script src="/i18n.js"></script>
<script src="/hub-core.js"></script>
<script src="/inspection-resolver.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#111111;--s1:#111111;--s2:#1a1a1a;--bd:rgba(255,255,255,.14);
  --acc:#ff6600;--acc3:#cc5500;
  --green:#10b981;--yellow:#facc15;--orange:#f97316;--red:#ef4444;
  --tx:#f0f0f0;--tx2:#888888;--tx3:#444444
}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
body.light{
  --bg:#ffffff;--s1:#ffffff;--s2:#f5f5f5;--bd:rgba(0,0,0,.14);
  --tx:#141414;--tx2:#6b6b6b;--tx3:#a3a3a3
}
body.light #viewer{background:#cccccc}

#viewer{flex:1;position:relative;overflow:hidden;background:#0a0a0a}
#glCanvas,#pcCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#pcCanvas{display:none;touch-action:none}        /* shown only for kind=splat; touch-action:none keeps the browser from hijacking pinch/scroll (splat-pc.js handles its own touch). */
.splat-mode #glCanvas{display:none}
.splat-mode #pcCanvas{display:block}

#err{position:absolute;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#err.vis{display:flex}
#err .ebox{max-width:420px}
#err b{display:block;font-size:18px;font-weight:800;margin-bottom:8px}
#err p{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:14px}
#err a{color:var(--acc);text-decoration:none;font-weight:600}
#err a:hover{text-decoration:underline}

/* Timeline pane styles — same look as /inspection/'s Timeline (.ts-item).
   Each card is a clickable link to /inspection/<slug>?asset=<assetSlug>. */
.ts-list{display:flex;flex-direction:column;gap:6px}
.ts-item{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;color:var(--tx2);text-decoration:none;transition:all .12s;background:var(--s2)}
.ts-item:hover{border-color:var(--acc);color:var(--acc)}
.ts-date{font-size:12px;font-weight:700;letter-spacing:.3px}
.ts-pts{font-size:10px;opacity:.75;letter-spacing:.4px;text-transform:uppercase}
.ts-empty{padding:24px 8px;text-align:center;color:var(--tx3);font-size:11px;line-height:1.5}
.ts-loading{padding:24px 8px;text-align:center;color:var(--tx3);font-size:11px}
</style>
</head>
<body>

<header>
  <noctua-logo></noctua-logo>
  <a class="hbtn" id="backBtn" href="/assets/" data-pt="← Assets" data-en="← Assets">← Assets</a>
  <div class="hdiv"></div>
  <div class="proj"><b id="proj">—</b></div>
  <div class="sp"></div>
  <button class="hbtn" id="btnLang" title="Switch language" style="font-weight:700">EN</button>
  <button class="hbtn" id="btnTheme" title="Toggle theme"></button>
</header>

<!-- Inspector pane templates. The shell moves these into the right rail at mount. -->
<template id="pane-timeline">
  <div class="ts-loading" data-pt="Carregando inspeções…" data-en="Loading inspections…">Loading inspections…</div>
  <div class="ts-list" id="tsList" style="display:none"></div>
</template>

<div id="viewer">
  <canvas id="glCanvas" tabindex="0"></canvas>
  <canvas id="pcCanvas" tabindex="0"></canvas>
  <div id="loadOverlay">
    <div class="spin"></div>
    <div class="ll" id="loadLbl" data-pt="Carregando modelo…" data-en="Loading model…">Loading model…</div>
    <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
    <div class="ls" id="loadSub"></div>
  </div>
  <div id="err">
    <div class="ebox">
      <b id="errHead"></b>
      <p id="errBody"></p>
      <a href="/assets/" data-pt="Voltar pra Assets" data-en="Back to Assets">Back to Assets</a>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SceneCore    from '/scene-core.js';
import { mountViewerShell } from '/viewer-shell.js';
import { loadSplatPC, setPcTheme, setSplatTopView, setSplatFreeView } from '/splat-pc.js';

// ctx mirrors scene-core's shape so theme/view-toggle/load helpers all read
// from the same object. Declared up here so applyTheme can poke it during
// bootPrefs without hitting a TDZ on `scene`.
const ctx = {
  canvas: null, scene: null, renderer: null,
  perspCamera: null, orthoCamera: null, camera: null,
  controls: null, modelRoot: null, grid: null,
  viewMode: 'free', currentTheme: 'dark',
};

const isAdminUnlocked = window.NoctuaHub.isAdminUnlocked;

// ── Lang + theme ──────────────────────────────────────────────────────────
let _lang = 'en';
const NH = window.NoctuaHub;
NH.onLangChange(lng => { _lang = lng; });
NH.onThemeChange(t => {
  if (ctx.scene)  SceneCore.applySceneTheme(ctx, t);
  if (ctx.modelKind === 'splat') setPcTheme(t);
});
NH.bootViewerPrefs();
document.getElementById('btnLang').onclick  = NH.toggleLang;
document.getElementById('btnTheme').onclick = NH.toggleViewerTheme;

// ── Shell (rail + inspector + statusbar) ─────────────────────────────────
// Asset view's inspector has a single pane today — Timeline — which lists
// every inspection of THIS asset. Clicking a row navigates to the inspection
// viewer with ?asset preserved so the user can hop back to the same context.
//
// Modes: Free / Top — same as /inspection/.
//
// defaultPanel is desktop-only (mobile starts with canvas full so the user
// sees the model first; tapping the Timeline icon opens the bottom sheet).
const _shell = mountViewerShell({
  canvasContainer: document.getElementById('viewer'),
  insertAfter: document.querySelector('header'),
  panels: [
    { id: 'timeline', title: { i18n: 'shell.btn.timeline', fallback: 'Timeline' },
      iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
  ],
  panelsLabel: { i18n: 'shell.section.inspections', fallback: 'Inspeções' },
  modes: {
    initial: 'free',
    items: [
      { id: 'free', title: { i18n: 'shell.btn.free', fallback: 'Vista livre' },
        iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l4-4 4 4"/><path d="M9 5v14"/><path d="M19 15l-4 4-4-4"/><path d="M15 19V5"/></svg>',
        onSelect: () => applyFreeView() },
      { id: 'top', title: { i18n: 'shell.btn.top', fallback: 'Vista de topo' },
        iconSvg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><polyline points="12 12 15 10"/></svg>',
        onSelect: () => applyTopView() },
    ],
  },
  modesLabel: { i18n: 'shell.section.camera', fallback: 'Câmera' },
  defaultPanel: window.matchMedia('(max-width: 768px)').matches ? null : 'timeline',
});

// Move the Timeline template content into the pane. Same pattern used in
// /inspection/ — HTML stays declarative.
{
  const tpl  = document.getElementById('pane-timeline');
  const pane = _shell.panel('timeline');
  if (tpl && pane) pane.el.appendChild(tpl.content);
}

// Status bar — kind + verts/splat label + current view mode.
const _statusCache = { kind: '—', verts: '—', view: 'Free' };
function refreshStatus() {
  const items = [];
  if (_statusCache.kind !== '—') items.push({ value: _statusCache.kind });
  if (_statusCache.verts !== '—') items.push({ label: 'Verts', value: _statusCache.verts });
  items.push({ label: 'View', value: _statusCache.view });
  _shell.setStatus(items);
}
refreshStatus();

// ── View toggle (Free/Top) ───────────────────────────────────────────────
function applyFreeView() {
  if (ctx.modelKind === 'splat') setSplatFreeView();
  else                            SceneCore.setFreeView(ctx);
  _statusCache.view = 'Free'; refreshStatus();
}
function applyTopView() {
  if (ctx.modelKind === 'splat') {
    if (!setSplatTopView()) { _shell.mode().activate('free'); return; }
  } else {
    if (!SceneCore.setTopView(ctx)) { _shell.mode().activate('free'); return; }
  }
  _statusCache.view = 'Top'; refreshStatus();
}

// ── Scene ─────────────────────────────────────────────────────────────────
function initThree() {
  const canvas = document.getElementById('glCanvas');
  const viewer = document.getElementById('viewer');
  const w = viewer.clientWidth, h = viewer.clientHeight;

  ctx.canvas = canvas;
  ctx.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  ctx.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  ctx.renderer.setSize(w, h);
  ctx.renderer.shadowMap.enabled = true;
  ctx.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  ctx.renderer.toneMapping = THREE.ACESFilmicToneMapping;
  ctx.renderer.toneMappingExposure = 1.2;
  ctx.renderer.outputColorSpace = THREE.SRGBColorSpace;

  ctx.scene = new THREE.Scene();

  ctx.perspCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 500);
  ctx.perspCamera.position.set(8, 6, 12);

  const aspect = w / h, frustum = 20;
  ctx.orthoCamera = new THREE.OrthographicCamera(
    -frustum * aspect / 2,  frustum * aspect / 2,
     frustum / 2,          -frustum / 2,
     0.1, 1000
  );
  ctx.orthoCamera.position.set(0, 100, 0);
  ctx.orthoCamera.up.set(0, 0, -1);
  ctx.orthoCamera.lookAt(0, 0, 0);
  ctx.camera = ctx.perspCamera;

  ctx.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(10, 20, 10); sun.castShadow = true;
  sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 200;
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
  sun.shadow.mapSize.set(2048, 2048);
  ctx.scene.add(sun);
  ctx.scene.add(new THREE.HemisphereLight(0x222222, 0x111111, 0.4));

  SceneCore.applySceneTheme(ctx, document.body.classList.contains('light') ? 'light' : 'dark');

  ctx.controls = new OrbitControls(ctx.camera, canvas);
  ctx.controls.enableDamping = true;
  ctx.controls.dampingFactor = 0.08;
  ctx.controls.minDistance = 1;
  ctx.controls.maxDistance = 120;
  ctx.controls.target.set(0, 2, 0);
  ctx.controls.update();

  new ResizeObserver(() => {
    const vw = viewer.clientWidth, vh = viewer.clientHeight;
    ctx.renderer.setSize(vw, vh);
    ctx.perspCamera.aspect = vw / vh;
    ctx.perspCamera.updateProjectionMatrix();
    if (ctx.viewMode === 'top') {
      const a = vw / vh;
      const half = (ctx.orthoCamera.top - ctx.orthoCamera.bottom) / 2;
      ctx.orthoCamera.left = -half * a; ctx.orthoCamera.right = half * a;
      ctx.orthoCamera.updateProjectionMatrix();
    }
  }).observe(viewer);

  (function loop() {
    requestAnimationFrame(loop);
    ctx.controls.update();
    ctx.renderer.render(ctx.scene, ctx.camera);
  })();
}

function showError(head, body) {
  document.getElementById('errHead').textContent = head;
  document.getElementById('errBody').textContent = body || '';
  document.getElementById('loadOverlay').classList.add('hidden');
  document.getElementById('err').classList.add('vis');
}

// ── Timeline pane: list the asset's inspections ──────────────────────────
// Same data flow as /inspection/'s Timeline tab: fetch /inspections/index.json,
// resolve each, keep the ones whose .asset matches our slug. Splat assets
// never have inspections (no raycastable mesh) — surface a clear empty state
// instead of an indefinite loading spinner.
async function populateTimeline(assetSlug, isSplat, adminUnlocked) {
  const pane    = _shell.panel('timeline').el;
  const loading = pane.querySelector('.ts-loading');
  const list    = pane.querySelector('.ts-list');
  const setEmpty = (text) => {
    loading.textContent = text;
    loading.style.display = '';
    list.style.display = 'none';
  };
  if (isSplat) {
    setEmpty(_lang === 'pt'
      ? 'Modelos de splat ainda não suportam pontos de inspeção.'
      : 'Splat models don\'t support inspection markers yet.');
    return;
  }
  let allSlugs = [];
  try {
    const r = await fetch('/inspections/index.json', { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (Array.isArray(j)) allSlugs = j; }
  } catch {}
  if (!allSlugs.length) {
    setEmpty(_lang === 'pt' ? 'Nenhuma inspeção cadastrada.' : 'No inspections yet.');
    return;
  }
  const items = (await Promise.all(allSlugs.map(async s => {
    try {
      const { inspection, composed } = await NoctuaInspections.fetchInspectionResolved(s);
      if (inspection.asset !== assetSlug) return null;
      return { slug: s, date: composed.date || null, points: Array.isArray(composed.points) ? composed.points.length : 0 };
    } catch { return null; }
  }))).filter(Boolean);
  if (!items.length) {
    setEmpty(_lang === 'pt'
      ? 'Nenhuma inspeção para este ativo.'
      : 'No inspections for this asset yet.');
    return;
  }
  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));   // newest first
  const ptsW = _lang === 'pt' ? 'pts' : 'pts';
  const baseHref = adminUnlocked ? '/admin/edit/' : '/inspection/';
  list.innerHTML = items.map(i => {
    const href = `${baseHref}?slug=${encodeURIComponent(i.slug)}&asset=${encodeURIComponent(assetSlug)}`;
    const date = i.date || '—';
    return `<a class="ts-item" href="${href}"><span class="ts-date">${date}</span><span class="ts-pts">${i.points} ${ptsW}</span></a>`;
  }).join('');
  loading.style.display = 'none';
  list.style.display = '';
}

// ── Boot ──────────────────────────────────────────────────────────────────
async function boot() {
  // Slug resolution order (mirrors /inspection/'s viewer):
  //   1. sessionStorage `noctua_route` — set by OG page (asset/<slug>/index.html)
  //      or 404.html fallback when the user lands on /asset/<slug>. Restore the
  //      pretty URL so reloads/share-from-here keep working.
  //   2. /asset/<slug>/ path segment (direct hit if GitHub Pages serves the
  //      route via the OG file).
  //   3. ?slug= query param (legacy + admin).
  let slug = null;
  try {
    const captured = sessionStorage.getItem('noctua_route');
    if (captured) {
      const r = JSON.parse(captured);
      if (r && r.page === 'asset' && r.slug) {
        slug = r.slug;
        sessionStorage.removeItem('noctua_route');
      }
    }
  } catch (_) {}
  if (!slug) {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts[0] === 'asset' && parts[1]) slug = parts[1];
  }
  if (!slug) slug = new URLSearchParams(location.search).get('slug');
  if (!slug || !/^[a-z0-9-]+$/i.test(slug)) {
    showError(_lang === 'pt' ? 'Asset não especificado' : 'No asset specified',
              _lang === 'pt' ? 'Use ?slug=<slug>.' : 'Use ?slug=<slug>.');
    return;
  }
  // Always normalize to /asset/<slug> so a URL copied from the address bar
  // points at the OG-enabled route (WhatsApp/social previews need a real
  // HTML file at that path, not the ?slug= query form). Preserve any
  // remaining query params so admin/debug flags survive the rewrite.
  try {
    const qs = new URLSearchParams(location.search);
    qs.delete('slug');
    const tail = qs.toString();
    const pretty = `/asset/${slug}${tail ? '?' + tail : ''}`;
    if (location.pathname + location.search !== pretty) {
      history.replaceState({}, '', pretty);
    }
  } catch (_) {}
  // Admin gets the "← Admin" back link instead of "← Assets" so the nav
  // stays inside the admin workflow.
  const admin = isAdminUnlocked();
  const backBtn = document.getElementById('backBtn');
  if (admin) {
    backBtn.href = '/admin/';
    backBtn.dataset.pt = '← Admin';
    backBtn.dataset.en = '← Admin';
    backBtn.textContent = '← Admin';
  }

  let asset;
  try {
    const r = await fetch(`/assets/${slug}.json`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    asset = await r.json();
  } catch (e) {
    showError(_lang === 'pt' ? 'Asset não encontrado' : 'Asset not found', e.message);
    return;
  }
  if (asset.requireLogin !== false && !admin) {
    showError(_lang === 'pt' ? 'Asset privado' : 'Private asset',
              _lang === 'pt' ? 'Este asset não está disponível publicamente.' : 'This asset is not public.');
    return;
  }
  document.getElementById('proj').textContent = asset.name || slug;
  document.title = `Noctua — ${asset.name || slug}`;
  // Splat assets don't host inspections (no raycastable mesh) — kind === 'splat'
  // also wins over a missing kind when the model URL is a .splat/.ply file.
  const isSplat = asset.kind === 'splat' || SceneCore.isSplatUrl(asset.model);
  _statusCache.kind = isSplat ? 'SPLAT' : 'GLB';
  refreshStatus();
  // Populate the Timeline pane right away — independent of model loading.
  populateTimeline(slug, isSplat, admin);

  if (!asset.model) {
    showError(_lang === 'pt' ? 'Asset incompleto' : 'Incomplete asset',
              _lang === 'pt' ? 'O asset não tem modelo configurado.' : 'No model configured for this asset.');
    return;
  }
  const overlayEls = {
    overlay: document.getElementById('loadOverlay'),
    sub:     document.getElementById('loadSub'),
    fill:    document.getElementById('progFill'),
  };
  try {
    if (isSplat) {
      document.body.classList.add('splat-mode');
      ctx.modelKind = 'splat';
      const initialTheme = document.body.classList.contains('light') ? 'light' : 'dark';
      await loadSplatPC({
        canvas: document.getElementById('pcCanvas'),
        url: asset.model,
        name: asset.modelName || asset.name || slug,
        modelRotation: asset.modelRotation,
        modelOffset: asset.modelOffset,
        modelScale: asset.modelScale,
        theme: initialTheme,
        lang: _lang,
        els: overlayEls,
      });
      _statusCache.verts = '—';
      refreshStatus();
    } else {
      initThree();
      const { verts } = await SceneCore.loadGLBProgress(ctx, {
        url: asset.model,
        name: asset.modelName || 'asset.glb',
        modelRotation: asset.modelRotation,
        modelOffset: asset.modelOffset,
        modelScale: asset.modelScale,
        lang: _lang,
        els: overlayEls,
      });
      _statusCache.verts = `${(verts/1000).toFixed(0)}k`;
      refreshStatus();
    }
  } catch (err) {
    showError(_lang === 'pt' ? 'Erro ao carregar modelo' : 'Failed to load model', err.message || 'unknown');
  }
}
boot();
</script>
</body>
</html>
