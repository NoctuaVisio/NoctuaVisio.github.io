# Build context is the repo root; the Dockerfile lives in api/.
# Invoked by infra/01-deploy.sh with _IMAGE and _TAG substitutions.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - api/Dockerfile
      - -t
      - '${_IMAGE}:${_TAG}'
      - -t
      - '${_IMAGE}:latest'
      - .
images:
  - '${_IMAGE}:${_TAG}'
  - '${_IMAGE}:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
